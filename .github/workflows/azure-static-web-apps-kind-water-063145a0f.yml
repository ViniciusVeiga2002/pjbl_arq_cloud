name: Deploy do frontend (Azure Static Web Apps)

# Publica o shell e os dois microfrontends remotos. Cada um é compilado de
# forma independente (frontend/<app>/dist) e o script montar-dist.js junta
# os três em frontend/dist: shell na raiz, remotos em /mfe-pedidos e
# /mfe-frota. O backend NÃO é mais publicado aqui (antes, api_location
# apontava para as Functions): agora ele é formado por Function Apps
# próprios, publicados pelo workflow backend-azure-functions.yml.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  testes:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    uses: ./.github/workflows/testes.yml

  build_and_deploy_job:
    needs: testes
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build dos microfrontends (shell + mfe-pedidos + mfe-frota)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_WATER_063145A0F }}
          action: "upload"
          app_location: "frontend/dist"
          output_location: ""
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
