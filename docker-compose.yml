# Infraestrutura LOCAL de desenvolvimento (no Azure, estes papéis são do
# MongoDB Atlas e de uma Storage Account — ver README).
#
#   docker compose up -d
#
# Database per Service também no ambiente local: cada microsserviço tem o
# seu próprio servidor MongoDB, em portas diferentes.
services:
  mongo-pedidos:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [dados-pedidos:/data/db]

  mongo-frota:
    image: mongo:7
    ports: ["27018:27017"]
    volumes: [dados-frota:/data/db]

  # Emulador do Azure Storage: filas "pedidos-eventos" e "telemetria-veiculos"
  # (EDA) e o armazenamento interno do runtime do Azure Functions.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports: ["10000:10000", "10001:10001", "10002:10002"]

volumes:
  dados-pedidos:
  dados-frota:
